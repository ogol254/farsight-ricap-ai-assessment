apiVersion: apps/v1
kind: Deployment
metadata: {name: ricap-ai}
spec:
  replicas: 2
  selector: {matchLabels: {app: ricap-ai}}
  template:
    metadata: {labels: {app: ricap-ai}}
    spec:
      containers:
        - name: api
          image: ghcr.io/example/ricap-ai:VERSION
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
          startupProbe: {httpGet: {path: /health, port: 8000}, failureThreshold: 30, periodSeconds: 10}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env: [{name: MODEL_DIR, value: /models/uc1}]
          envFrom: [{secretRef: {name: ricap-ai-secrets}}]
          volumeMounts: [{name: model, mountPath: /models/uc1, readOnly: true}]
      # Provision the approved C1 artifact on this claim before deploying.
      volumes: [{name: model, persistentVolumeClaim: {claimName: ricap-uc1-model}}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ricap-ai}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ricap-ai}
  minReplicas: 2
  maxReplicas: 8
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
