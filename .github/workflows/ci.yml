name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt -r requirements-connected.txt
      - run: python -m compileall app assessment_code
      - run: python tests/test_api.py
      - run: python -m unittest discover -s tests -p 'test_assessment.py' -v
      - run: python -m unittest tests.test_connected -v
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
